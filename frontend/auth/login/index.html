<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>UniQuest | Log in</title>
</head>
<body>
    <!-- Top navigation bar -->
    <header class="navbar">
        <a href="#" class="logo">
            <span class="logoIcon">♛</span>
            <span>UniQuest</span>
        </a>
    </header>

    <!-- Main login section -->
    <main class="loginPage">
        <h1>Welcome back</h1>

        <!-- Login form card -->
        <section class="loginCard">
            <h2>Log in</h2>
            <p class="subtitle">Use your university email to continue your quests.</p>

            <p id="loginSuccess" class="formSuccess" role="status" hidden></p>
            <p id="loginError" class="formError" role="alert" hidden></p>

            <form id="loginForm">
                <div class="formGroup">
                    <label for="universityEmail">University email</label>
                    <input type="email" id="universityEmail" name="universityEmail" placeholder="Enter your university email" required>
                </div>
    
                <!-- Password -->
                <div class="formGroup">
                    <label for="loginPassword">password</label>

                    <div class="passwordWrapper">
                        <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required>

                        <button type="button" id="togglePassword" class="togglePassword" aria-label="Show password">Show</button>
                    </div>
                </div>

                <!-- Remember me and forgot password -->
                <div class="formOptions">
                    <label class="rememberMe">
                        <input type="checkbox" id="rememberMe" name="remember">

                        <span>Remember me for 30 days</span>
                    </label>

                    <a href="#" class="forgotPassword">Forgot password?</a>
                </div>
    
                <!-- Submit button -->
                <button type="submit" class="loginButton">Log in <span aria-hidden="true">→</span></button>
            </form>
        </section>

        <!-- Account creation link -->
        <p class="registerLink">New to UniQuest? <a href="../registration/register.html">Create an account</a></p>

        <!-- Footer -->
        <footer class="footer">
            <span>© 2026 UniQuest</span>

            <div>
                <p>Privacy</p>
                <p>Get help</p>
            </div>
        </footer>
    </main>

    <script src="../registration/api.js"></script>
    <script src="login.js"></script>
</body>
</html>
